name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @overlay/desktop build

  package-windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Writes OVERLAY_* and BUILD_NUMBER to $GITHUB_ENV (see apps/desktop/scripts/version-cli.mjs).
      # On pull requests the displayed sha is the PR head, not the merge commit.
      - name: Compute version
        env:
          OVERLAY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node apps/desktop/scripts/version-cli.mjs --word ci
      - name: Verify version
        run: ': "${OVERLAY_VERSION:?version script did not export OVERLAY_VERSION}"'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @overlay/desktop build
      - name: Package installer
        run: >-
          pnpm --filter @overlay/desktop exec electron-builder --win nsis --publish never
          -c.extraMetadata.version="$OVERLAY_VERSION"
          -c.buildVersion="$OVERLAY_WINDOWS_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: overlay-windows-installer-${{ env.OVERLAY_VERSION }}
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
