name: Release

# Builds the unsigned NSIS installer and publishes it as a GitHub Release asset, so people
# download the plain .exe instead of a zipped Actions artifact. See docs/releasing.md.
#
# - Tag push v<semver>: a release (a prerelease if the semver has a prerelease part).
# - Manual dispatch from a branch: always a prerelease with a beta version. Dispatch from a tag is rejected.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release at a time; a running release is never cancelled half way.
concurrency:
  group: release
  cancel-in-progress: false

# The source repo is only read. Releases are written to RELEASES_REPO with RELEASES_TOKEN.
permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASES_REPO: ${{ vars.RELEASES_REPO || 'peter-swiatek/overlay-releases' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check trigger
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "::error::Run this workflow from a branch, not a tag. Stable releases come from pushing a v<semver> tag; dispatch only publishes beta prereleases."
            exit 1
          fi
      - name: Check release credentials
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::Secret RELEASES_TOKEN is not set. Create a fine-grained token with Contents: read and write on $RELEASES_REPO only, and add it as a repository secret (see docs/releasing.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Writes OVERLAY_* and BUILD_NUMBER to $GITHUB_ENV. On a tag push it fails when the tag
      # and apps/desktop/package.json disagree. Dispatch builds are <version>-beta.<run>.
      - name: Compute version
        run: node apps/desktop/scripts/version-cli.mjs --word beta
      - name: Verify version
        run: ': "${OVERLAY_VERSION:?version script did not export OVERLAY_VERSION}"'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @overlay/desktop build
      - name: Package installer
        run: >-
          pnpm --filter @overlay/desktop exec electron-builder --win nsis --publish never
          -c.extraMetadata.version="$OVERLAY_VERSION"
          -c.buildVersion="$OVERLAY_WINDOWS_VERSION"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        working-directory: apps/desktop/release
        run: |
          set -euo pipefail
          tag="v${OVERLAY_VERSION}"
          exe="Overlay-Setup-${OVERLAY_VERSION}.exe"
          for f in "$exe" "$exe.blockmap" latest.yml; do
            test -f "$f" || { echo "::error::Missing build output $f"; exit 1; }
          done

          # Dispatch builds and any semver with a prerelease part are prereleases. Computed once
          # and passed explicitly, so a re-run never keeps a stale flag.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "$OVERLAY_VERSION" == *-* ]]; then
            is_pre=true
            latest=false
          else
            is_pre=false
            latest=true
          fi

          # Public repo: no generated notes and no commit messages.
          notes="Overlay ${OVERLAY_VERSION}, built $(date -u +%Y-%m-%d). Unsigned Windows installer: if SmartScreen warns, choose More info, then Run anyway."

          # Draft first, so a failed upload never leaves an empty public release.
          if gh release view "$tag" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$RELEASES_REPO" --title "Overlay ${OVERLAY_VERSION}" --notes "$notes" --prerelease="$is_pre" --latest="$latest"
          else
            gh release create "$tag" --repo "$RELEASES_REPO" --draft --title "Overlay ${OVERLAY_VERSION}" --notes "$notes" --prerelease="$is_pre" --latest="$latest"
          fi
          gh release upload "$tag" "$exe" "$exe.blockmap" latest.yml --repo "$RELEASES_REPO" --clobber
          gh release edit "$tag" --repo "$RELEASES_REPO" --draft=false
