appId: com.peterswiatek.overlay
productName: Overlay
npmRebuild: false
publish:
  provider: github
  owner: peter-swiatek
  repo: overlay-releases
  updaterCacheDirName: overlay-updater
directories:
  output: release
files:
  - out/**
  - package.json
# koffi loads a native .node file, which cannot be loaded from inside app.asar.
asarUnpack:
  - "**/node_modules/koffi/**"
  - "**/node_modules/@koromix/koffi-*/**"
extraResources:
  - from: resources/tray.ico
    to: tray.ico
# win.verifyUpdateCodeSignature is left at its default on purpose. Unsigned builds write no
# publisherName to app-update.yml, so unsigned updates are accepted; if signing is added later the
# check turns on automatically.
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/tray.ico
  artifactName: Overlay-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
